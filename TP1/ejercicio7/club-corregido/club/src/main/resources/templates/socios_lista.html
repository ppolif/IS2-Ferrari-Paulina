<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div id="app">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div id="main">
        <header class="mb-3">
            <a href="#" class="burger-btn d-inline-block"><i class="bi bi-justify fs-3"></i></a>
        </header>
        <div class="page-heading d-flex justify-content-between align-items-center">
            <h3>Listado de Socios</h3>
            <a th:href="@{/registro}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo Socio</a>
        </div>
        <div class="page-content">
            <section class="section">
                <div class="card">
                    <div class="card-header">
                        <form th:action="@{/socios}" method="GET" class="d-flex">
                            <input type="text" class="form-control me-2" name="q" th:value="${query}" placeholder="Buscar por Nombre, Apellido o DNI">
                            <button type="submit" class="btn btn-primary">Buscar</button>
                        </form>
                    </div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>Nro Socio</th>
                                <th>DNI</th>
                                <th>Nombre y Apellido</th>
                                <th>Acción</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="socio : ${socios}">
                                <td th:text="${socio.nroSocio}"></td>
                                <td th:text="${socio.dni}"></td>
                                <td th:text="${socio.nombre + ' ' + socio.apellido}"></td>
                                <td>
                                    <a th:href="@{/socios/{id}(id=${socio.id})}" class="btn btn-sm btn-info">Ver Detalle</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
