<!--
    familia_detalle.html
    ----------------------------------------------------------------------
    Detalle de un grupo familiar. Visible tanto para ADMIN (cualquier
    familia) como para un SOCIO que pertenezca a ESE grupo (ver el chequeo
    de "ownership" en FamiliaController#detalleFamilia).

    Las acciones de administración (agregar encargado, agregar familiar,
    registrar pago) solo se muestran con sec:authorize="hasRole('ADMIN')":
    un socio puede ver a los integrantes de su familia y el historial de
    pagos, pero no puede modificar el grupo ni cobrar la cuota.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div id="app">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div id="main">
        <header class="mb-3">
            <a href="#" class="burger-btn d-inline-block"><i class="bi bi-justify fs-3"></i></a>
        </header>

        <div class="page-heading d-flex justify-content-between align-items-center">
            <h3 th:text="'Grupo Familiar: ' + ${familia.apellido}"></h3>
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/pagos/nuevo(idFamilia=${familia.id})}" class="btn btn-success">
                <i class="bi bi-cash-coin"></i> Registrar pago de cuota
            </a>
        </div>

        <div class="page-content">
            <div th:if="${exito != null}" class="alert alert-success" th:text="${exito}"></div>
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header"><h4>Socios Titulares (encargados)</h4></div>
                        <div class="card-body">
                            <ul class="list-group mb-3">
                                <li class="list-group-item d-flex justify-content-between align-items-center" th:each="socio : ${familia.socios}">
                                    <span th:text="${socio.nombre + ' ' + socio.apellido + ' (DNI: ' + socio.dni + ')'}"></span>
                                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/socios/{id}(id=${socio.id})}" class="badge bg-primary rounded-pill">Ver</a>
                                </li>
                                <li class="list-group-item text-muted" th:if="${familia.socios.isEmpty()}">Sin encargados asignados todavía.</li>
                            </ul>

                            <!-- Alta rápida de encargado: solo ADMIN, solo socios sin grupo -->
                            <form sec:authorize="hasRole('ADMIN')" th:action="@{/familias/{id}/encargados(id=${familia.id})}" method="POST" class="d-flex gap-2">
                                <select name="idSocio" class="form-select" required>
                                    <option value="">Agregar socio existente como encargado...</option>
                                    <option th:each="s : ${sociosSinFamilia}" th:value="${s.id}"
                                            th:text="${s.nombre + ' ' + s.apellido + ' (Socio N°' + s.nroSocio + ')'}"></option>
                                </select>
                                <button type="submit" class="btn btn-outline-primary text-nowrap">Agregar</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header"><h4>Adherentes (sin cuenta propia)</h4></div>
                        <div class="card-body">
                            <ul class="list-group mb-3">
                                <li class="list-group-item" th:each="fam : ${familia.familiares}"
                                    th:text="${fam.nombre + ' ' + fam.apellido + ' (' + fam.parentesco + ')'}"></li>
                                <li class="list-group-item text-muted" th:if="${familia.familiares.isEmpty()}">Sin adherentes cargados todavía.</li>
                            </ul>

                            <!-- Alta rápida de familiar: solo ADMIN -->
                            <form sec:authorize="hasRole('ADMIN')" th:action="@{/familias/{id}/familiares(id=${familia.id})}" method="POST" th:object="${familiarDTO}">
                                <div class="row g-2">
                                    <div class="col-md-6"><input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre" required></div>
                                    <div class="col-md-6"><input type="text" class="form-control" th:field="*{apellido}" placeholder="Apellido" required></div>
                                    <div class="col-md-6"><input type="number" class="form-control" th:field="*{dni}" placeholder="DNI" required></div>
                                    <div class="col-md-6"><input type="text" class="form-control" th:field="*{parentesco}" placeholder="Parentesco (ej: Hijo/a)" required></div>
                                </div>
                                <button type="submit" class="btn btn-outline-primary mt-2">Agregar familiar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header"><h4>Historial de Pagos de Cuota</h4></div>
                        <div class="card-body">
                            <table class="table table-striped">
                                <thead>
                                <tr><th>Fecha</th><th>Monto</th><th>Forma de Pago</th><th>Estado</th><th>Comprobante</th></tr>
                                </thead>
                                <tbody>
                                <tr th:each="pago : ${pagos}">
                                    <td th:text="${pago.fechaPago}"></td>
                                    <td th:text="${'$' + pago.monto}"></td>
                                    <td th:text="${pago.formaPago}"></td>
                                    <td th:text="${pago.estado}"></td>
                                    <td th:text="${pago.comprobante}"></td>
                                </tr>
                                <tr th:if="${pagos.isEmpty()}"><td colspan="5" class="text-muted">Todavía no se registraron pagos.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
