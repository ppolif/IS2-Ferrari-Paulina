spring.application.name=club

spring.datasource.url=jdbc:mysql://localhost:3306/club?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Tamano maximo permitido para la foto de perfil (Imagen) subida en /registro
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Credenciales del administrador "semilla" que crea DataInitializer la
# primera vez que se levanta la aplicación (si todavía no existe ningún
# ADMIN). Cambialas antes de desplegar a producción, o sobreescribilas
# por variable de entorno (CLUB_ADMIN_CORREO / CLUB_ADMIN_CLAVE).
club.admin.correo=admin@club.com
club.admin.clave=admin1234
