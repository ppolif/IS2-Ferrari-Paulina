<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Sistema Usuario</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
</head>
<body>
<div id="main" class="p-4">
    <div class="page-heading d-flex justify-content-between align-items-center mb-4">
        <!-- Ahora sí, 'usuariosession' es un objeto y podemos leer su 'correo' -->
        <h3>Bienvenido/a, <span th:text="${session.usuariosession.correo}">Usuario</span>!</h3>

        <!-- Botón de Logout -->
        <a th:href="@{/logout}" class="btn btn-danger shadow-sm">
            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </a>
    </div>

    <div class="page-content">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Panel Principal</h5>
                <p class="card-text">Has ingresado exitosamente al sistema. Desde aquí podrás gestionar tus datos.</p>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
