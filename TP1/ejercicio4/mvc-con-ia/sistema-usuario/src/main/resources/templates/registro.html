<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema Usuarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/pages/auth.css}">
</head>

<body>
<div id="auth">
    <div class="row h-100">
        <div class="col-lg-5 col-12" style="overflow-y: auto; max-height: 100vh;">
            <!-- Se agregó overflow y max-height para que se pueda scrollear si el formulario es muy largo -->
            <div id="auth-left">
                <div class="auth-logo">
                    <a th:href="@{/}"><img th:src="@{/assets/images/logo/logo.png}" alt="Logo"></a>
                </div>
                <h1 class="auth-title">Registro</h1>
                <p class="auth-subtitle mb-5">Ingrese sus datos para registrarse en el sistema.</p>

                <!-- Alerta para mostrar errores (ej: contraseñas no coinciden) -->
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- th:object="${usuario}" -> Vincula este formulario con el objeto 'Usuario' vacío
                     que enviamos desde el modelo en el AuthController (model.addAttribute("usuario", new Usuario());) -->
                <form th:action="@{/registro}" th:object="${usuario}" method="post">

                    <!-- DATOS PERSONALES (Heredados de Persona) -->
                    <div class="form-group position-relative has-icon-left mb-4">
                        <!-- th:field="*{nombre}" -> El asterisco indica que 'nombre' es un atributo del objeto
                             declarado en th:object. Se encarga automáticamente de asignar el 'id', 'name' y 'value'. -->
                        <input type="text" class="form-control form-control-xl" placeholder="Nombre" th:field="*{nombre}" required>
                        <div class="form-control-icon"><i class="bi bi-person"></i></div>
                    </div>

                    <div class="form-group position-relative has-icon-left mb-4">
                        <input type="text" class="form-control form-control-xl" placeholder="Apellido" th:field="*{apellido}" required>
                        <div class="form-control-icon"><i class="bi bi-person"></i></div>
                    </div>

                    <div class="form-group position-relative has-icon-left mb-4">
                        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="form-control form-control-xl" placeholder="Documento (DNI)" th:field="*{dni}" required>
                        <div class="form-control-icon"><i class="bi bi-card-text"></i></div>
                    </div>

                    <div class="form-group position-relative has-icon-left mb-4">
<!--                        <label class="text-muted mb-2">Fecha de Nacimiento</label>-->
                        <input type="date" class="form-control form-control-xl" th:field="*{fechaNac}" min="1930-01-01" max="2025-12-31" required>
                        <div class="form-control-icon" style="top: 2.2rem;"><i class="bi bi-calendar"></i></div>
                    </div>

                    <!-- DATOS DE USUARIO -->
                    <div class="form-group position-relative has-icon-left mb-4">
                        <!-- Usamos el campo de email de la plantilla[cite: 3] adaptado -->
                        <input type="email" class="form-control form-control-xl" placeholder="Correo Personal" th:field="*{correo}" required>
                        <div class="form-control-icon"><i class="bi bi-envelope"></i></div>
                    </div>

                    <div class="form-group position-relative has-icon-left mb-4">
                        <input type="password" class="form-control form-control-xl" placeholder="Contraseña" th:field="*{clave}" required>
                        <div class="form-control-icon"><i class="bi bi-shield-lock"></i></div>
                    </div>

                    <div class="form-group position-relative has-icon-left mb-4">
                        <!-- Este input NO usa th:field porque 'repeticionClave' no existe en la clase Usuario.
                             Usamos 'name' normal para capturarlo con @RequestParam en el Controlador. -->
                        <input type="password" class="form-control form-control-xl" placeholder="Confirmar Contraseña" name="repeticionClave" required>
                        <div class="form-control-icon"><i class="bi bi-shield-lock"></i></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg shadow-lg mt-5">Registrarse</button>
                </form>

                <div class="text-center mt-5 text-lg fs-4">
                    <p class='text-gray-600'>¿Ya tienes una cuenta? <a th:href="@{/login}" class="font-bold">Ingresar</a>.</p>
                </div>
            </div>
        </div>
        <div class="col-lg-7 d-none d-lg-block">
            <div id="auth-right">
            </div>
        </div>
    </div>
</div>
</body>
</html>
