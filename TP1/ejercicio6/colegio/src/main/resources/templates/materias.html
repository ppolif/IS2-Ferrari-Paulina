<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
</head>
<body>
<div id="main" class="p-4">
    <div class="page-heading d-flex justify-content-between align-items-center mb-4">
        <h3>Listado de Materias</h3>
        <div class="d-flex gap-2">
            <a sec:authorize="hasRole('PROFESOR')" th:href="@{/profesor/cambiar-clave}" class="btn btn-secondary">
                Cambiar Contraseña
            </a>
            <a th:href="@{/logout}" class="btn btn-danger">Cerrar Sesión</a>
        </div>
    </div>
    <div class="page-content">
        <div th:if="${exito != null}" class="alert alert-success" th:text="${exito}"></div>
        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card">
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Grado</th>
                        <th>Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="materia : ${materias}">
                        <td th:text="${materia.nombre}"></td>
                        <td th:text="${materia.grado}"></td>
                        <td>
                            <a th:href="@{/materias/detalle/{id}(id=${materia.id})}" class="btn btn-sm btn-info">Ver Detalle</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
